      display: block;
      padding: 15px 20px;
      background: #00d2ff;
      background: linear-gradient(to right, #00c6ff, #0072ff);

      font-weight: bold;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
    }
    .btn-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 114, 255, 0.6);
